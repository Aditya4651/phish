<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Login - Phishing Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container max-w-450">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-cyan display-3"></i>
            <h2 class="fw-bold text-white mt-2">Security Portal Login</h2>
            <p class="text-muted small">AI-Based Phishing URL Detection System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card cyber-card p-4 shadow-lg border-cyan">
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-cyan fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-cyan border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-cyan fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-cyan border-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold cyber-btn py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Access Dashboard
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/" class="text-cyan text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Public Scanner</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
